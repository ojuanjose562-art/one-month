<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>LOVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral: #d97b73;
    --pink-dark: #e23b6a;
    --pink-mid: #f4a9c2;
    --pink-light: #fbd9e6;
    --cream: #fff6f3;
    --ink: #3a1f2b;
    --gold: #ffd27a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Quicksand', ui-monospace, monospace;
    background: linear-gradient(135deg, #ffe3ea 0%, #fbc2d6 40%, #f0a3c4 75%, #e78fc0 100%);
    background-size: 250% 250%;
    animation: bgShift 14s ease-in-out infinite;
    overflow: hidden;
    touch-action: manipulation;
  }

  @keyframes bgShift { 0%, 100% { background-position: 0% 30%; } 50% { background-position: 100% 70%; } }

  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; filter: blur(50px); opacity: .55; }
  .blob { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
  .blob1 { width: 280px; height: 280px; background: var(--gold); top: -60px; left: -40px; animation: float1 16s ease-in-out infinite; }
  .blob2 { width: 340px; height: 340px; background: var(--pink-dark); bottom: -100px; right: -60px; animation: float2 19s ease-in-out infinite; }
  .blob3 { width: 220px; height: 220px; background: #fff2b8; top: 40%; left: 60%; animation: float3 13s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,60px);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,40px) scale(1.15);} }

  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

  .drift-heart, .sparkle { position: absolute; color: var(--pink-dark); will-change: transform; }
  .drift-heart { opacity: .55; animation: drift linear infinite, sway ease-in-out infinite alternate; }
  .sparkle { opacity: 0; color: var(--gold); animation: twinkle ease-in-out infinite; }
  @keyframes drift { from { transform: translateY(112vh); } to { transform: translateY(-12vh); } }
  @keyframes sway { from { margin-left: -18px; } to { margin-left: 18px; } }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.4); } 50% { opacity: .9; transform: scale(1); } }

  .cursor-glow {
    position: fixed; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.5), transparent 70%);
    pointer-events: none; z-index: 1; transform: translate(-50%, -50%);
    transition: opacity .3s ease; opacity: 0;
  }
  @media (hover: none) { .cursor-glow { display: none; } }

  /* ---------------- Splash de apertura ---------------- */
  #splash {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #ffd9e4, #f2a7c6);
    font-family: 'VT323', monospace; color: var(--ink);
    animation: splashOut .5s ease forwards; animation-delay: 1.25s;
  }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
  .heart-spinner { font-size: 44px; color: var(--pink-dark); animation: heartbeat 1s ease-in-out infinite; }
  @keyframes heartbeat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.28); } 40% { transform: scale(.95); } 60% { transform: scale(1.18); } }
  #splash p { font-size: 20px; letter-spacing: 2px; margin: 0; opacity: .85; }

  .stage {
    position: relative; z-index: 2; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    perspective: 1300px;
  }

  .window {
    width: min(400px, 100%);
    position: relative;
    border-radius: 20px;
    background: rgba(255, 246, 243, 0.55);
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow:
      0 34px 80px rgba(90, 20, 45, .38),
      0 0 0 1.5px rgba(255,255,255,.65) inset,
      0 0 0 2.5px rgba(217,123,115,.5);
    overflow: hidden;
    transform-origin: center bottom;
    animation: popIn .85s cubic-bezier(.2,1.1,.3,1) both, glow 4.5s ease-in-out 2s infinite;
    animation-delay: 1.5s, 2.3s;
  }

  .window::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.4) 50%, transparent 65%);
    background-size: 250% 250%;
    background-position: 200% 200%;
    animation: sheen 7s ease-in-out 2.4s infinite;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 3;
  }
  @keyframes sheen { 0%, 92%, 100% { background-position: 200% 200%; } 96% { background-position: -60% -60%; } }

  .window.closing { animation: closeAnim .45s cubic-bezier(.5,-.2,.7,.3) forwards; }
  .window.hidden { display: none; }
  .window.wobble .titlebar { animation: wobble .5s ease; }

  @keyframes popIn {
    0% { transform: perspective(1300px) rotateX(-40deg) translateY(50px) scale(.82); opacity: 0; }
    55% { transform: perspective(1300px) rotateX(6deg) translateY(-8px) scale(1.02); opacity: 1; }
    100% { transform: perspective(1300px) rotateX(0) translateY(0) scale(1); opacity: 1; }
  }
  @keyframes closeAnim { to { transform: perspective(1300px) rotateX(-32deg) translateY(30px) scale(.72); opacity: 0; } }
  @keyframes glow {
    0%,100% { box-shadow: 0 34px 80px rgba(90,20,45,.38), 0 0 0 1.5px rgba(255,255,255,.65) inset, 0 0 0 2.5px rgba(217,123,115,.5); }
    50% { box-shadow: 0 34px 90px rgba(226,59,106,.5), 0 0 0 1.5px rgba(255,255,255,.8) inset, 0 0 0 2.5px rgba(226,59,106,.7); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-1.2deg) scale(1.015); }
    50% { transform: rotate(1deg) scale(.985); }
    75% { transform: rotate(-.6deg) scale(1.01); }
  }

  .titlebar {
    position: relative; z-index: 4;
    background: linear-gradient(90deg, var(--coral), var(--pink-dark));
    color: #fff; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'VT323', monospace; font-size: 20px; letter-spacing: 3px;
    cursor: pointer;
  }

  .dots { display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.25) inset;
    cursor: pointer; transition: transform .15s ease, filter .15s ease;
  }
  .dot:hover { transform: scale(1.15); filter: brightness(1.1); }
  .dot-close { background: #ff5f57; }
  .dot-min { background: #ffbd2e; }
  .dot-max { background: #28c840; }

  #soundBtn {
    background: none; border: none; color: #fff; font-size: 16px;
    padding: 0; margin-right: 6px; cursor: pointer; line-height: 1; box-shadow: none;
  }

  .collapsible {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .38s ease;
  }
  .collapsible > div { overflow: hidden; min-height: 0; }
  .window.minimized .collapsible { grid-template-rows: 0fr; }

  .ribbon {
    background: var(--pink-light); padding: 9px;
    display: flex; justify-content: center; gap: 10px;
    font-size: clamp(16px, 4vw, 19px); border-bottom: 3px solid var(--coral);
    user-select: none;
  }
  .ribbon span { display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  .ribbon span:nth-child(2) { animation-delay: .2s; }
  .ribbon span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  .body {
    padding: clamp(20px, 6vw, 30px) clamp(16px, 5vw, 24px) clamp(24px, 6vw, 32px);
    background-image:
      linear-gradient(rgba(251,217,230,.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(251,217,230,.6) 1px, transparent 1px);
    background-size: 22px 22px;
    text-align: center; position: relative; z-index: 2;
  }

  h1 {
    margin: 0 0 20px; font-family: 'VT323', monospace;
    font-size: clamp(22px, 6.2vw, 26px); line-height: 1.35;
    background: linear-gradient(90deg, var(--pink-dark), var(--coral), var(--pink-dark));
    background-size: 200% auto; animation: shine 5s linear infinite;
    -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 1px;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .cat-wrap { width: min(46vw, 170px); margin: 0 auto 22px; animation: bob 2.4s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-1.5deg); } }
  .cat-wrap.happy { animation: happyBounce .55s ease-in-out infinite; }
  @keyframes happyBounce { 0%,100%{ transform: translateY(0) scale(1) rotate(0deg); } 50%{ transform: translateY(-16px) scale(1.08) rotate(3deg); } }

  canvas#cat { image-rendering: pixelated; width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 16px rgba(120, 20, 60, .3)); }

  .choices { position: relative; height: 70px; display: flex; align-items: center; justify-content: center; gap: 14px; }

  button.action {
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .5px;
    padding: 13px 24px; min-height: 46px; min-width: 84px; border-radius: 10px;
    border: 3px solid var(--coral); background: #fff; color: var(--ink); cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, left .18s ease, top .18s ease;
    box-shadow: 0 4px 0 rgba(217,123,115,.4);
  }
  button.action:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(217,123,115,.4); }
  button.action:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 2px; }

  #yesBtn {
    background: linear-gradient(135deg, var(--pink-dark), var(--coral));
    color: #fff; border-color: var(--pink-dark); box-shadow: 0 4px 0 #a5254a;
    transition: transform .2s cubic-bezier(.3,1.4,.5,1), left .18s ease, top .18s ease;
  }
  #yesBtn:active { transform: scale(var(--yes-scale, 1)) translateY(2px); }
  #noBtn { position: relative; }

  .footer-note { margin-top: 16px; font-size: 12px; color: #9c5b6b; opacity: .8; }

  .burst-heart { position: fixed; font-size: 16px; color: var(--pink-dark); pointer-events: none; z-index: 5; animation: burst .7s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }

  #reopenPill {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--pink-dark); color: #fff; border: none; border-radius: 999px;
    padding: 12px 22px; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px;
    box-shadow: 0 10px 26px rgba(90,20,45,.4); cursor: pointer; z-index: 6;
    opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
  }
  #reopenPill.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

  @media (max-width: 380px) {
    .choices { gap: 10px; }
    button.action { padding: 11px 18px; font-size: 14px; }
    .blobs { filter: blur(34px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .drift-heart, .sparkle, .window, .window::before, .cat-wrap, .ribbon span, html, body, h1 { animation: none !important; }
    #splash { animation: none !important; opacity: 0; visibility: hidden; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="splash"><div class="heart-spinner">♥</div><p>abriendo LOVE.exe…</p></div>

<div class="blobs"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>
<div class="sky" id="sky"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="stage">
  <div class="window" id="win">
    <div class="titlebar" id="titlebar">
      <span>LOVE</span>
      <div class="dots">
        <button id="soundBtn" aria-label="Silenciar sonido">🔊</button>
        <button class="dot dot-min" id="minBtn" aria-label="Minimizar"></button>
        <button class="dot dot-max" id="maxBtn" aria-label="Maximizar"></button>
        <button class="dot dot-close" id="closeBtn" aria-label="Cerrar"></button>
      </div>
    </div>
    <div class="collapsible"><div>
      <div class="ribbon"><span>♥</span><span>♥</span><span>♥</span></div>
      <div class="body" id="windowBody">
        <h1 id="title"></h1>
        <div class="cat-wrap" id="catWrap"><canvas id="cat" width="16" height="16"></canvas></div>
        <div class="choices">
          <button class="action" id="yesBtn"></button>
          <button class="action" id="noBtn"></button>
        </div>
        <p class="footer-note" id="note"></p>
      </div>
    </div></div>
  </div>
</div>

<button id="reopenPill">💌 Abrir de nuevo</button>

<script>
/* ======================= CONFIG: edita aquí ======================= */
const CONFIG = {
  title: "Happy 1 month, my love ♡ Still love me?",
  yesLabel: "YES",
  noLabel: "NO",
  successTitle: "¡Yupiii! Te amo más cada día ♥",
  note: "psst… el botón NO no coopera mucho"
};
/* ==================================================================== */

const isMobile = window.matchMedia('(max-width: 480px)').matches;
const canHover = window.matchMedia('(hover: hover)').matches;

document.getElementById('title').textContent = CONFIG.title;
document.getElementById('yesBtn').textContent = CONFIG.yesLabel;
document.getElementById('noBtn').textContent = CONFIG.noLabel;
document.getElementById('note').textContent = CONFIG.note;

/* ---------- Gato pixelado (grid propio, espejado en runtime) ---------- */
const leftHalf = [
  "........","..k.....","..kk....",".kkkk...",".kkkkk..","kkkkkkk.","kkkkkkkk",
  "kwwkkkkk","kwnkkkkk","kkkkkkkk","kkkpkkkk","kkkrkkkk","kkrrkkkk","kkkrkkkk",
  "kkkkkkkk","kkkkkkkk"
];
const blinkHalf = [
  "........","..k.....","..kk....",".kkkk...",".kkkkk..","kkkkkkk.","kkkkkkkk",
  "kkkkkkkk","kkkkkkkk","kkkkkkkk","kkkpkkkk","kkkrkkkk","kkrrkkkk","kkkrkkkk",
  "kkkkkkkk","kkkkkkkk"
];
const happyHalf = [
  "........","..k.....","..kk....",".kkkk...",".kkkkk..","kkkkkkk.","kkkkkkkk",
  "krrkkkkk","krrkkkkk","kkkkkkkk","kkkpkkkk","kkkrkkkk","kkrrkkkk","kkkrkkkk",
  "kkkkkkkk","kkkkkkkk"
];
const palette = { k: "#241b22", w: "#ffffff", n: "#2c2c52", p: "#ff9fbb", r: "#e0245e" };

const catCanvas = document.getElementById('cat');
const catWrap = document.getElementById('catWrap');
const ctx = catCanvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let currentGrid = leftHalf;
function drawCat(grid) {
  ctx.clearRect(0, 0, 16, 16);
  grid.forEach((row, y) => {
    const full = row + row.split('').reverse().join('');
    full.split('').forEach((c, x) => {
      if (c === '.') return;
      ctx.fillStyle = palette[c];
      ctx.fillRect(x, y, 1, 1);
    });
  });
}
drawCat(currentGrid);

function blink() {
  if (currentGrid === happyHalf) return;
  drawCat(blinkHalf);
  setTimeout(() => drawCat(currentGrid), 140);
}
setInterval(blink, 3200 + Math.random() * 1500);

/* ------------------------- Sonido con Web Audio ------------------------- */
let audioCtx = null;
let soundOn = true;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type = 'sine', gain = 0.05) {
  if (!soundOn) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq; g.gain.value = gain;
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start();
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.stop(audioCtx.currentTime + dur);
}
document.getElementById('soundBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  e.currentTarget.setAttribute('aria-label', soundOn ? 'Silenciar sonido' : 'Activar sonido');
});

/* ---------------------- Botón NO que huye ---------------------- */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const choices = document.querySelector('.choices');
let yesScale = 1;

function burstAt(x, y, count = 8) {
  for (let i = 0; i < count; i++) {
    const h = document.createElement('span');
    h.className = 'burst-heart';
    h.textContent = '♥';
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const dist = 40 + Math.random() * 30;
    h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    h.style.left = x + 'px'; h.style.top = y + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 720);
  }
}

function dodge() {
  const bounds = choices.getBoundingClientRect();
  const btnBounds = noBtn.getBoundingClientRect();
  const maxX = Math.max(0, bounds.width - btnBounds.width);
  const maxY = 44;
  const newX = Math.random() * maxX - (btnBounds.left - bounds.left);
  const newY = (Math.random() * maxY) - 22;
  noBtn.style.left = newX + 'px';
  noBtn.style.top = newY + 'px';
  yesScale = Math.min(yesScale + 0.09, 1.7);
  yesBtn.style.setProperty('--yes-scale', yesScale);
  yesBtn.style.transform = `scale(${yesScale})`;
  burstAt(btnBounds.left + btnBounds.width / 2, btnBounds.top + btnBounds.height / 2, 5);
  playTone(320 + Math.random() * 120, 0.12, 'triangle', 0.04);
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive: false });
noBtn.addEventListener('focus', dodge);

/* ------------------------- Corazones y destellos ambientales ------------------------- */
function rainHearts(count = 26) {
  const sky = document.getElementById('sky');
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'drift-heart';
    h.textContent = Math.random() > 0.5 ? '♥' : '♡';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (4 + Math.random() * 5) + 's, ' + (1.6 + Math.random() * 1.4) + 's';
    h.style.fontSize = (14 + Math.random() * 20) + 'px';
    sky.appendChild(h);
    setTimeout(() => h.remove(), 9500);
  }
}
function makeSparkles(count = 6) {
  const sky = document.getElementById('sky');
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle'; s.textContent = '✦';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = (8 + Math.random() * 10) + 'px';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    sky.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}
rainHearts(isMobile ? 6 : 9);
setInterval(() => rainHearts(isMobile ? 1 : 2), 2600);
setInterval(() => makeSparkles(isMobile ? 3 : 6), 2200);

if (canHover) {
  const glow = document.getElementById('cursorGlow');
  document.addEventListener('mousemove', (e) => {
    glow.style.opacity = '1'; glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
}

/* ------------------------------- YES ------------------------------- */
yesBtn.addEventListener('click', (e) => {
  document.getElementById('title').textContent = CONFIG.successTitle;
  document.getElementById('note').textContent = '';
  noBtn.style.display = 'none';
  currentGrid = happyHalf;
  drawCat(currentGrid);
  catWrap.classList.add('happy');
  yesScale = 1.5;
  yesBtn.style.transform = `scale(${yesScale})`;
  const r = e.currentTarget.getBoundingClientRect();
  burstAt(r.left + r.width / 2, r.top + r.height / 2, isMobile ? 14 : 20);
  rainHearts(isMobile ? 30 : 60);
  makeSparkles(isMobile ? 10 : 18);
  playTone(523, 0.15, 'sine', 0.06);
  setTimeout(() => playTone(659, 0.18, 'sine', 0.06), 140);
  setTimeout(() => playTone(784, 0.22, 'sine', 0.06), 280);
});

/* ------------------------- Ventana: cerrar / minimizar / maximizar ------------------------- */
const win = document.getElementById('win');
const titlebar = document.getElementById('titlebar');
const reopenPill = document.getElementById('reopenPill');
const closeBtn = document.getElementById('closeBtn');
const minBtn = document.getElementById('minBtn');
const maxBtn = document.getElementById('maxBtn');

closeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  win.classList.remove('minimized');
  win.classList.add('closing');
  playTone(220, 0.2, 'sine', 0.05);
  win.addEventListener('animationend', function handler(ev) {
    if (ev.animationName !== 'closeAnim') return;
    win.classList.add('hidden');
    win.classList.remove('closing');
    reopenPill.classList.add('show');
    win.removeEventListener('animationend', handler);
  });
});

reopenPill.addEventListener('click', () => {
  reopenPill.classList.remove('show');
  win.classList.remove('hidden');
  win.style.animation = 'none';
  void win.offsetWidth; /* reflow para poder reiniciar la animación */
  win.style.animation = '';
  win.classList.add('reopening');
  win.style.animation = 'popIn .7s cubic-bezier(.2,1.1,.3,1) both, glow 4.5s ease-in-out .5s infinite';
  playTone(660, 0.16, 'sine', 0.06);
});

minBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  win.classList.toggle('minimized');
  playTone(400, 0.1, 'triangle', 0.04);
});

titlebar.addEventListener('click', () => {
  if (win.classList.contains('minimized')) win.classList.remove('minimized');
});

maxBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  win.classList.add('wobble');
  playTone(500, 0.12, 'square', 0.03);
  setTimeout(() => win.classList.remove('wobble'), 550);
});
</script>
